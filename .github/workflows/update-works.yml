name: Update works data
on:
  push:
    paths: ['Departmental_Ongoing_Works_Professional.xlsx']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install openpyxl
      - run: python build_works.py Departmental_Ongoing_Works_Professional.xlsx
      - run: |
          git config user.name "works-bot"
          git config user.email "works-bot@users.noreply.github.com"
          git add data.js
          git diff --cached --quiet || (git commit -m "Update works data" && git push)
